[runtime]
app_name = benchmark_publisher

[publisher]
# type: iceoryx, zenoh
type = iceoryx
service = Benchmark
instance = Default
event = Data
max_payload_size = 4096
rate_hz = 100000

[generator]
# algorithm: fixed, schema_guided, property_guided
algorithm = schema_guided
schema = config/schemas/message.json
# seed: 0 = true random, non-zero = reproducible random
seed = 0
# input file for replay (used with algorithm=fixed)
replay = dump/benchmark_input.jsonl

[serializer]
# type: json, protobuf, flatbuffers
type = protobuf
# proto_message: message type for protobuf (e.g., osi::SensorViewMessage)
proto_message = osi::SensorViewMessage
# fbs_message: message type for flatbuffers (e.g., osi::SensorViewMessage)
fbs_message = osi::SensorViewMessage

[dump]
# enable recording of generated messages
enabled = false
# output file for dump (JSONL format - one JSON per line)
output = dump/benchmark.jsonl
