syntax = "proto3";

package osi;

message Vector3d {
    double x = 1;
    double y = 2;
    double z = 3;
}

message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
}

message BaseMoving {
    Vector3d position = 1;
    Vector3d velocity = 2;
    Vector3d orientation = 3;
}

message MovingObject {
    uint64 id = 1;
    BaseMoving base = 2;

    enum Type {
        TYPE_UNKNOWN = 0;
        TYPE_VEHICLE = 1;
        TYPE_PEDESTRIAN = 2;
        TYPE_ANIMAL = 3;
    }
    Type type = 3;
}

message SensorViewMessage {
    Timestamp timestamp = 1;
    uint64 sensor_id = 2;
    repeated MovingObject moving_object = 3;
    string sensor_name = 4;
    bool is_valid = 5;
}
