[runtime]
app_name = "benchmark_perf_%i"

[schema]
bfbs = "schemas/osi_sensorview.bfbs"

[generator]
algorithm = "schema_guided"
seed = 1

[serializer]
type = "flatbuffers"

#[filewriter]
# write to /tmp to avoid hammering the repo dir
#output = "/tmp/rybench-perf-%i.out"
# high rate -> engine interval (1000/rate_hz) integer-divides to 0 -> no throttle
#rate_hz = 100000
#count = 0

[iceoryx2]
# mode: publish or consume
mode = "publish"
service = "Benchmark"
instance = "Default"
event = "Data"
max_payload_size = 4096
rate_hz = 100000
# output: file path for consume mode (received messages)
output = "dump/iceoryx2-%i-received.bin"