[runtime]
app_name = "bench_ice_fx_%i"

[schema]
bfbs = "schemas/osi_sensorview.bfbs"

[generator]
algorithm = "fixed"
seed = 1
replay = "/tmp/rybench-fixed.dump"

[serializer]
type = "flatbuffers"

[iceoryx2]
mode = "publish"
service = "Benchmark"
instance = "Default"
event = "Data"
max_payload_size = 8192
rate_hz = 100000
output = "dump/iceoryx2-%i-received.bin"
